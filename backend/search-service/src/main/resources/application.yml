server:
  port: 8083

spring:
  application:
    name: search-service

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/redteam_file?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: postgres
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 50

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000ms

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: search-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false

# Elasticsearch配置
elasticsearch:
  hosts: localhost:9200
  username: elastic
  password: elastic123
  connection-timeout: 5000
  socket-timeout: 30000

# Milvus配置
milvus:
  host: localhost
  port: 19530
  database: default
  vector-dimension: 768
  index-type: IVF_FLAT
  metric-type: L2

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.redteam.search.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 检索服务配置（v2.5 新增）
redteam:
  search:
    es:
      index-name: redhead-files
      shards: 3
      replicas: 1
    milvus:
      host: ${MILVUS_HOST:localhost}
      port: ${MILVUS_PORT:19530}
      collection-name: file_vectors
      vector-dim: 768
      index-type: IVF_FLAT
      metric-type: COSINE
      nlist: 1024
      nprobe: 16
    embedding:
      api-url: ${EMBEDDING_API_URL:http://localhost:8081/embed}
      timeout-seconds: 10
      cache-enabled: true
    hybrid:
      rrf-k: 60
      top-k-per-source: 50
    cache:
      ttl-seconds: 300
  kafka:
    topic:
      parse-events: redteam.parse.events
      search-events: redteam.search.events

# 日志配置
logging:
  level:
    root: info
    com.redteam: debug
