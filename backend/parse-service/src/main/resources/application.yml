server:
  port: 8082

spring:
  application:
    name: parse-service

  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/redteam_file?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: postgres
    password: postgres
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 10
      max-active: 50

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000ms

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: parse-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      concurrency: 5
      ack-mode: manual

# MinIO配置
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: redteam-files

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.redteam.parse.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# Knife4j配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# 解析服务业务配置
redteam:
  parse:
    # 最大提取字符数（默认 1MB）
    max-text-length: 1048576
    # Tika 解析超时（秒，仅作为监控指标）
    tika-timeout-seconds: 60
    # 本地临时目录
    temp-dir: /tmp/parse-temp
    yara:
      # yara CLI 路径
      cli-path: /usr/bin/yara
      # 编译产物缓存目录
      rules-dir: /tmp/yara-rules
      # 是否启用 YARA 扫描
      enabled: true
    ner:
      # security-BERT 模型本地路径
      model-path: models/security-bert
      # 是否使用正则兜底（模型加载失败自动启用）
      use-regex-fallback: true
      # 缓存 TTL（秒）
      cache-ttl-seconds: 3600
      # 置信度阈值
      confidence-threshold: 0.7
  kafka:
    bootstrap-servers: localhost:9092
    topic:
      file-events: redteam.file.events
      parse-events: redteam.parse.events

# 日志配置
logging:
  level:
    root: info
    com.redteam: debug
