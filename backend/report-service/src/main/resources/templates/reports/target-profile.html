<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>目标画像报告</title>
    <style>
        body {
            font-family: "SimSun", "STSong", serif;
            padding: 40px;
            color: #333;
            line-height: 1.8;
        }
        h1 {
            text-align: center;
            font-size: 26px;
            color: #16a085;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 18px;
            border-left: 4px solid #16a085;
            padding-left: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
        .meta {
            background: #f8f9fa;
            padding: 15px 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }
        .meta p { margin: 5px 0; }
        .meta .label {
            display: inline-block;
            width: 100px;
            color: #888;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: #f5f5f5;
            font-weight: bold;
        }
        tr:nth-child(even) { background-color: #fafafa; }
        .footer {
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px dashed #ccc;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        .conclusion {
            background: #eafaf1;
            padding: 15px 20px;
            border-left: 4px solid #16a085;
            margin: 15px 0;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 15px 0;
        }
        .profile-item {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 4px;
        }
        .profile-item .lbl {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 4px;
        }
        .profile-item .val {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <h1 th:text="${reportName}">目标画像报告</h1>

    <div class="meta">
        <p><span class="label">报告编号：</span><span th:text="${reportId}">-</span></p>
        <p><span class="label">目标编号：</span><span th:text="${targetId != null ? targetId : '-'}">-</span></p>
        <p><span class="label">生成时间：</span><span th:text="${#temporals.format(generatedAt, 'yyyy-MM-dd HH:mm:ss')}">-</span></p>
    </div>

    <h2>一、画像概述</h2>
    <p th:text="${taskSummary != null ? taskSummary : '本报告基于多源情报与扫描结果，构建目标资产的全维度画像。'}">
        画像概述内容
    </p>

    <h2>二、基础属性</h2>
    <div class="profile-grid">
        <div class="profile-item">
            <span class="lbl">所属行业</span>
            <span class="val">互联网</span>
        </div>
        <div class="profile-item">
            <span class="lbl">资产规模</span>
            <span class="val">中型</span>
        </div>
        <div class="profile-item">
            <span class="lbl">暴露面</span>
            <span class="val">Web、API、DNS</span>
        </div>
        <div class="profile-item">
            <span class="lbl">技术栈</span>
            <span class="val">Java、Nginx、PostgreSQL</span>
        </div>
    </div>

    <h2>三、关联发现</h2>
    <table>
        <thead>
            <tr>
                <th style="width: 60px;">序号</th>
                <th style="width: 180px;">发现项</th>
                <th style="width: 100px;">风险等级</th>
                <th>描述</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item, stat : ${findings}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${item.name}">发现项名称</td>
                <td th:text="${item.riskLevel}">风险等级</td>
                <td th:text="${item.description}">发现项描述</td>
            </tr>
            <tr th:if="${findings == null or findings.isEmpty()}">
                <td colspan="4" style="text-align: center; color: #999;">暂无关联发现</td>
            </tr>
        </tbody>
    </table>

    <h2>四、风险评估</h2>
    <div class="conclusion">
        <p th:text="${conclusion != null ? conclusion : '综合评估目标整体风险为中等偏高，建议针对暴露面进行收敛，并加强身份认证与访问控制。'}">
            风险评估内容
        </p>
    </div>

    <div class="footer">
        <p>本报告由网络安全红方文件汇聚平台自动生成，仅供内部使用。</p>
        <p>RedTeam File Platform &copy; 2026</p>
    </div>
</body>
</html>
