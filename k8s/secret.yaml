---
# =============================================================================
# 红方文件汇聚平台 - 密钥配置 (占位符)
# 严禁: 真实密钥不要提交到 git! 使用 Sealed Secrets / External Secrets / Vault
#
# 生成 base64 值 (Linux/macOS):
#   echo -n 'your-secret' | base64
# 生成 base64 值 (PowerShell):
#   [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('your-secret'))
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: redteam-common-secret
  namespace: redteam-platform
  labels:
    app.kubernetes.io/part-of: redteam-platform
type: Opaque
data:
  # PostgreSQL 密码 (明文: redteam123)
  POSTGRES_PASSWORD: cmVkdGVhbTEyMw==
  # Redis 密码 (明文: redteam123)
  REDIS_PASSWORD: cmVkdGVhbTEyMw==
  # Neo4j 密码 (明文: redteam123)
  NEO4J_PASSWORD: cmVkdGVhbTEyMw==
  # MinIO Access Key (明文: redteam)
  MINIO_ACCESS_KEY: cmVkdGVhbQ==
  # MinIO Secret Key (明文: redteam123)
  MINIO_SECRET_KEY: cmVkdGVhbTEyMw==
  # Nacos 密码 (明文: nacos)
  NACOS_PASSWORD: bmFjb3M=
  # JWT 密钥 (明文: redteam-jwt-secret-key-please-change-in-production-32bytes)
  JWT_SECRET: cmVkdGVhbS1qd3Qtc2VjcmV0LWtleS1wbGVhc2UtY2hhbmdlLWluLXByb2R1Y3Rpb24tMzJieXRlcw==
  # Elasticsearch (预留)
  ELASTIC_PASSWORD: ""
  # Kafka SASL (预留)
  KAFKA_SASL_PASSWORD: ""
---
# 各服务数据库连接信息 Secret (示例: auth-service)
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: redteam-platform
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: redteam-platform
type: Opaque
stringData:
  # 使用 stringData 便于阅读, K8s 会自动转 base64
  SPRING_DATASOURCE_USERNAME: "auth_user"
  SPRING_DATASOURCE_PASSWORD: "redteam123"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres.redteam-middleware.svc.cluster.local:5432/auth_db"
