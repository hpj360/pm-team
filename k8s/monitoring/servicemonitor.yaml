---
# =============================================================================
# Prometheus ServiceMonitor - 监控抓取配置
# 需安装 Prometheus Operator (kube-prometheus-stack)
# 应用侧需暴露 /actuator/prometheus (Spring Boot Micrometer)
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redteam-services-monitor
  namespace: redteam-platform
  labels:
    app.kubernetes.io/part-of: redteam-platform
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/part-of: redteam-platform
  namespaceSelector:
    matchNames:
      - redteam-platform
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: true
      # 通过 Istio mTLS 抓取 (如启用 STRICT)
      params:
        # 可附加认证头
        {}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_version]
          targetLabel: version
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - targetLabel: cluster
          replacement: redteam-prod
---
# 前端监控 (Nginx stub_status, 需 nginx-exporter 侧车)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend-monitor
  namespace: redteam-platform
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: redteam-platform
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
---
# PrometheusRule - 告警规则
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redteam-alerts
  namespace: redteam-platform
  labels:
    app.kubernetes.io/part-of: redteam-platform
    release: kube-prometheus-stack
spec:
  groups:
    - name: redteam-service.rules
      rules:
        # 服务宕机
        - alert: RedteamServiceDown
          expr: up{namespace="redteam-platform"} == 0
          for: 2m
          labels:
            severity: critical
            team: redteam
          annotations:
            summary: "服务 {{ $labels.service }} 宕机"
            description: "Pod {{ $labels.pod }} 已离线超过 2 分钟"
        # 高错误率 (> 5%)
        - alert: RedteamHighErrorRate
          expr: |
            sum(rate(http_server_requests_seconds_count{namespace="redteam-platform",status=~"5.."}[2m]))
            /
            sum(rate(http_server_requests_seconds_count{namespace="redteam-platform"}[2m]))
            > 0.05
          for: 5m
          labels:
            severity: warning
            team: redteam
          annotations:
            summary: "{{ $labels.service }} 5xx 错误率过高"
            description: "5xx 错误率 {{ $value | humanizePercentage }} 超过 5% (持续 5 分钟)"
        # 高延迟 (P99 > 2s)
        - alert: RedteamHighLatency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_server_requests_seconds_bucket{namespace="redteam-platform"}[5m])) by (le, service)
            ) > 2
          for: 5m
          labels:
            severity: warning
            team: redteam
          annotations:
            summary: "{{ $labels.service }} P99 延迟过高"
            description: "P99 延迟 {{ $value }}s 超过 2s (持续 5 分钟)"
        # JVM 内存使用过高
        - alert: RedteamJvmMemoryHigh
          expr: |
            jvm_memory_used_bytes{namespace="redteam-platform",area="heap"}
            / jvm_memory_max_bytes{namespace="redteam-platform",area="heap"}
            > 0.85
          for: 10m
          labels:
            severity: warning
            team: redteam
          annotations:
            summary: "{{ $labels.service }} JVM 堆内存使用过高"
            description: "堆内存使用率 {{ $value | humanizePercentage }} 超过 85% (持续 10 分钟)"
        # Pod 重启频繁
        - alert: RedteamPodRestart
          expr: increase(kube_pod_container_status_restarts_total{namespace="redteam-platform"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
            team: redteam
          annotations:
            summary: "Pod {{ $labels.pod }} 频繁重启"
            description: "过去 1 小时内重启 {{ $value }} 次"
