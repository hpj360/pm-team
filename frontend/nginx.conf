# =============================================================================
# 红方文件汇聚平台 - Nginx 配置
# 功能: SPA 路由 / API 反向代理 / gzip 压缩 / 安全头 / 静态资源缓存
# =============================================================================

# 后端网关地址 (可通过环境变量覆盖)
upstream backend_gateway {
    server ${BACKEND_GATEWAY_HOST:-gateway}:${BACKEND_GATEWAY_PORT:-8080};
    keepalive 32;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # 字符集
    charset utf-8;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # 根目录
    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        application/vnd.ms-fontobject
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- 安全响应头 ----------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP 根据实际情况调整 (此处允许内联样式/脚本以兼容 Vite)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:;" always;

    # ---------- API 反向代理 ----------
    location /api/ {
        proxy_pass http://backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 超时设置 (大文件上传/长任务)
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 文件上传大小限制 (5GB)
        client_max_body_size 5g;

        # 缓冲区
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---------- WebSocket 代理 (通知服务) ----------
    location /ws/ {
        proxy_pass http://backend_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 健康检查端点 ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- 静态资源缓存 ----------
    location ~* \.(?:css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---------- index.html 不缓存 (保证发布即时生效) ----------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        access_log off;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 隐藏文件拦截 ----------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
