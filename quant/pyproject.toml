[project]
name = "quant"
version = "0.1.0"
description = "个人量化分析工具：A股/场外基金/加密币 数据+信号+建议单推送"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# 数据源与回测/UI 为重依赖，按需安装：pip install -e .[full]
full = [
    "akshare>=1.14",
    "ccxt>=4.0",
    "vectorbt>=0.26",
    "streamlit>=1.36",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
quant = "quant.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.ruff.lint]
# 项目统一使用 naive 本地时间：数据源（akshare/ccxt/天天基金）返回的 bar 时点均为
# naive 时间戳，DuckDB 落库与信号 point-in-time 比较也基于 naive 语义，
# 强制 tz-aware 会破坏整条比较链，故关闭 DTZ 系列规则。
ignore = ["DTZ001", "DTZ005", "DTZ006", "DTZ011"]

[tool.pytest.ini_options]
markers = [
    "network: 需要真实网络的契约测试（默认跳过）",
    "testnet: 需要交易所 testnet API Key 的闭环测试（默认跳过）",
]
