syntax = "proto3";

package redteam.file;

import "common.proto";

option java_package = "com.redteam.upload.grpc";
option java_multiple_files = true;
option go_package = "redteam/file;filepb";

// ============================================================================
// 文件服务 gRPC 定义
// 提供跨服务的文件信息查询、状态更新、解析结果获取能力
// 服务端口：gRPC 9081（与 upload-service REST 8081 同进程）
// ============================================================================

service FileService {
  // 根据文件 ID 获取文件元信息
  rpc GetFileInfo(GetFileInfoRequest) returns (FileInfo);

  // 根据文件 SHA256 获取文件信息（用于秒传校验）
  rpc GetFileByHash(GetFileByHashRequest) returns (FileInfo);

  // 更新文件状态（如：UPLOADING -> UPLOADED -> PARSING -> PARSED -> ANALYZED）
  rpc UpdateFileStatus(UpdateFileStatusRequest) returns (redteam.common.Result);

  // 获取文件解析结果（结构化内容）
  rpc GetFileParseResult(GetFileParseResultRequest) returns (FileParseResult);

  // 批量获取文件信息
  rpc BatchGetFileInfo(BatchGetFileInfoRequest) returns (BatchGetFileInfoResponse);

  // 校验文件访问权限
  rpc CheckFileAccess(CheckFileAccessRequest) returns (CheckFileAccessResponse);

  // 健康检查
  rpc Health(redteam.common.HealthCheckRequest) returns (redteam.common.HealthCheckResponse);
}

// ============================================================================
// 文件信息
// ============================================================================

message GetFileInfoRequest {
  // 文件 ID
  string file_id = 1;
  // 请求上下文
  redteam.common.RequestContext context = 2;
}

message GetFileByHashRequest {
  // 文件 SHA256 指纹
  string sha256 = 1;
  // 租户 ID
  string tenant_id = 2;
}

message BatchGetFileInfoRequest {
  // 文件 ID 列表
  repeated string file_ids = 1;
  // 请求上下文
  redteam.common.RequestContext context = 2;
}

message BatchGetFileInfoResponse {
  // 文件信息列表
  repeated FileInfo files = 1;
  // 未找到的文件 ID 列表
  repeated string not_found_ids = 2;
}

// 文件元信息
message FileInfo {
  // 文件 ID
  string file_id = 1;
  // 文件名
  string name = 2;
  // 文件路径（对象存储 key）
  string path = 3;
  // 文件大小（字节）
  int64 size = 4;
  // MIME 类型
  string mime_type = 5;
  // 文件后缀
  string extension = 6;
  // MD5
  string md5 = 7;
  // SHA256
  string sha256 = 8;
  // 文件状态：UPLOADING / UPLOADED / PARSING / PARSED / ANALYZING / ANALYZED / FAILED
  string status = 9;
  // 上传者用户 ID
  string uploader_id = 10;
  // 租户 ID
  string tenant_id = 11;
  // 存储桶
  string bucket = 12;
  // 当前版本号
  int32 version = 13;
  // 关联目标 ID（可选）
  string target_id = 14;
  // 标签列表
  repeated string tags = 15;
  // 创建时间（毫秒时间戳）
  int64 created_at = 16;
  // 更新时间（毫秒时间戳）
  int64 updated_at = 17;
}

// ============================================================================
// 文件状态更新
// ============================================================================

message UpdateFileStatusRequest {
  // 文件 ID
  string file_id = 1;
  // 目标状态
  string status = 2;
  // 状态变更原因（如失败原因）
  string reason = 3;
  // 操作人用户 ID
  string operator_id = 4;
}

// ============================================================================
// 文件解析结果
// ============================================================================

message GetFileParseResultRequest {
  // 文件 ID
  string file_id = 1;
  // 请求上下文
  redteam.common.RequestContext context = 2;
}

message FileParseResult {
  // 文件 ID
  string file_id = 1;
  // 解析状态：PENDING / RUNNING / SUCCESS / FAILED
  string status = 2;
  // 解析类型：TEXT / OCR / STRUCTURED / BINARY
  string parse_type = 3;
  // 提取的纯文本内容（可能截断，完整内容建议走 REST 接口）
  string text_content = 4;
  // 文本内容长度
  int32 text_length = 5;
  // 提取的元数据（key-value）
  repeated redteam.common.KeyValue metadata = 6;
  // 提取的图片列表（URL）
  repeated string images = 7;
  // 解析耗时（毫秒）
  int64 duration_ms = 8;
  // 解析时间（毫秒时间戳）
  int64 parsed_at = 9;
  // 失败原因（status=FAILED 时有效）
  string error_message = 10;
}

// ============================================================================
// 文件访问权限校验
// ============================================================================

message CheckFileAccessRequest {
  // 文件 ID
  string file_id = 1;
  // 用户 ID
  string user_id = 2;
  // 操作类型：READ / DOWNLOAD / DELETE / SHARE
  string action = 3;
}

message CheckFileAccessResponse {
  // 是否允许访问
  bool allowed = 1;
  // 拒绝原因
  string reason = 2;
}
