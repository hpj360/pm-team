openapi: 3.0.3
info:
  title: 红方文件汇聚平台 - 检索服务 API
  description: |
    检索服务，提供混合检索（全文 + 元数据 + 向量）、搜索建议、热词、历史能力。

    - 服务端口：8083
    - API 前缀：/api/v1
    - 认证方式：Bearer JWT
    - 限流策略：2000 QPS / 租户
    - 检索引擎：Elasticsearch + 向量数据库
  version: 1.0.0
  contact:
    name: 红方团队
    email: redteam@example.com

servers:
  - url: http://localhost:8083
    description: 本地开发环境
  - url: https://api.redteam.internal/search
    description: 生产环境

tags:
  - name: 检索
    description: 混合检索、搜索建议
  - name: 搜索历史
    description: 历史记录、热词

paths:
  /api/v1/search:
    post:
      tags: [检索]
      summary: 混合检索
      description: |
        支持三种检索模式可组合：
        - FULLTEXT：全文检索（基于 ES 倒排索引）
        - METADATA：元数据过滤（结构化字段）
        - VECTOR：语义向量检索（基于嵌入模型）

        默认开启 FULLTEXT + METADATA；启用 VECTOR 时结果按融合分数排序。
      operationId: search
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              fulltext:
                summary: 全文检索
                value:
                  query: "钓鱼邮件样本"
                  modes: [FULLTEXT]
                  page: 1
                  size: 20
              vector:
                summary: 语义检索
                value:
                  query: "类似 APT28 的攻击手法"
                  modes: [VECTOR]
                  page: 1
                  size: 20
              hybrid:
                summary: 混合检索
                value:
                  query: "勒索病毒 IOC"
                  modes: [FULLTEXT, METADATA, VECTOR]
                  filters:
                    extension: [exe, dll]
                    startTime: 1785000000000
                    endTime: 1785090000000
                  page: 1
                  size: 20
      responses:
        '200':
          description: 检索成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/search/suggest:
    post:
      tags: [检索]
      summary: 搜索建议
      description: 输入前缀实时返回补全建议（最多 10 条）。
      operationId: suggest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prefix:
                  type: string
                  description: 输入前缀（至少 2 字符）
                  minLength: 2
                limit:
                  type: integer
                  maximum: 10
                  default: 10
              required: [prefix]
      responses:
        '200':
          description: 建议列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                              description: 建议文本
                            score:
                              type: number
                              format: float
                              description: 匹配分数
                            count:
                              type: integer
                              description: 历史搜索次数

  /api/v1/search/hot:
    get:
      tags: [检索]
      summary: 热门搜索
      description: 返回近 24 小时热门搜索词。
      operationId: hotSearch
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 50
            default: 20
        - name: period
          in: query
          description: 统计周期
          schema:
            type: string
            enum: [HOUR, DAY, WEEK]
            default: DAY
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            keyword:
                              type: string
                            count:
                              type: integer
                              description: 搜索次数
                            trend:
                              type: number
                              description: 趋势（环比）

  /api/v1/search/history:
    get:
      tags: [搜索历史]
      summary: 搜索历史
      description: 当前用户的搜索历史。
      operationId: searchHistory
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
            default: 20
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            history_id:
                              type: string
                            keyword:
                              type: string
                            result_count:
                              type: integer
                            searched_at:
                              type: integer
                              format: int64
    delete:
      tags: [搜索历史]
      summary: 清空搜索历史
      operationId: clearSearchHistory
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 清空成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: 参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResult'
    TooManyRequests:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResult'
          example:
            code: 429
            message: 请求过于频繁，请稍后再试
            data: null
            timestamp: 1785086825000

  schemas:
    ApiResult:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
        timestamp:
          type: integer
          format: int64
      required: [code, message, timestamp]

    SearchRequest:
      type: object
      description: 检索请求
      properties:
        query:
          type: string
          description: 检索关键词
          minLength: 1
          maxLength: 256
        modes:
          type: array
          description: 检索模式组合
          items:
            type: string
            enum: [FULLTEXT, METADATA, VECTOR]
          default: [FULLTEXT, METADATA]
        filters:
          type: object
          description: 元数据过滤条件
          properties:
            file_ids:
              type: array
              items:
                type: string
            extensions:
              type: array
              items:
                type: string
            mime_types:
              type: array
              items:
                type: string
            target_ids:
              type: array
              items:
                type: string
            tags:
              type: array
              items:
                type: string
            uploader_ids:
              type: array
              items:
                type: string
            statuses:
              type: array
              items:
                type: string
            start_time:
              type: integer
              format: int64
              description: 创建起始时间（毫秒）
            end_time:
              type: integer
              format: int64
              description: 创建结束时间（毫秒）
            min_size:
              type: integer
              format: int64
              description: 最小文件大小（字节）
            max_size:
              type: integer
              format: int64
              description: 最大文件大小（字节）
        sort:
          type: object
          properties:
            field:
              type: string
              enum: [score, created_at, size, name]
              default: score
            order:
              type: string
              enum: [asc, desc]
              default: desc
        highlight:
          type: boolean
          description: 是否高亮命中片段
          default: true
        include_content:
          type: boolean
          description: 是否返回文本片段
          default: true
        page:
          type: integer
          minimum: 1
          default: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      required: [query]

    SearchResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              type: object
              properties:
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/SearchHit'
                total:
                  type: integer
                  format: int64
                page:
                  type: integer
                size:
                  type: integer
                took_ms:
                  type: integer
                  description: 检索耗时（毫秒）
                max_score:
                  type: number
                  format: float
                  description: 最高匹配分数

    SearchHit:
      type: object
      description: 检索命中结果
      properties:
        file_id:
          type: string
        name:
          type: string
        extension:
          type: string
        size:
          type: integer
          format: int64
        mime_type:
          type: string
        status:
          type: string
        target_id:
          type: string
        uploader_id:
          type: string
        uploader_name:
          type: string
        tags:
          type: array
          items:
            type: string
        score:
          type: number
          format: float
          description: 综合匹配分数
        scores:
          type: object
          description: 各模式分数明细
          properties:
            fulltext:
              type: number
              format: float
            vector:
              type: number
              format: float
            metadata:
              type: number
              format: float
        highlight:
          type: object
          description: 高亮片段（字段名 -> 高亮文本）
          additionalProperties:
            type: string
        snippet:
          type: string
          description: 文本片段（最多 300 字符）
        created_at:
          type: integer
          format: int64
