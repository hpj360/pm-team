openapi: 3.0.3
info:
  title: 红方文件汇聚平台 - 任务管理服务 API
  description: |
    任务管理服务，提供任务编排、状态机管理、时间线追踪能力。

    - 服务端口：8090
    - API 前缀：/api/v1
    - 认证方式：Bearer JWT
    - 限流策略：500 QPS / 租户
    - 状态机：PENDING -> RUNNING -> (PAUSED -> RUNNING)* -> COMPLETED / FAILED / CANCELLED
  version: 1.0.0
  contact:
    name: 红方团队
    email: redteam@example.com

servers:
  - url: http://localhost:8090
    description: 本地开发环境
  - url: https://api.redteam.internal/task
    description: 生产环境

tags:
  - name: 任务管理
    description: 任务 CRUD
  - name: 任务状态
    description: 启动/暂停/完成/取消
  - name: 任务时间线
    description: 状态流转历史

paths:
  /api/v1/tasks:
    post:
      tags: [任务管理]
      summary: 创建任务
      operationId: createTask
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'
    get:
      tags: [任务管理]
      summary: 任务列表
      operationId: listTasks
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: taskType
          in: query
          schema:
            type: string
            enum: [PARSE, ANALYZE, PROFILE, REPORT, SANDBOX, CUSTOM]
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED]
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, NORMAL, HIGH, URGENT]
        - name: refType
          in: query
          description: 关联资源类型
          schema:
            type: string
        - name: refId
          in: query
          description: 关联资源 ID
          schema:
            type: string
        - name: creatorId
          in: query
          schema:
            type: string
        - name: startTime
          in: query
          schema:
            type: integer
            format: int64
        - name: endTime
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPageResult'

  /api/v1/tasks/{taskId}:
    get:
      tags: [任务管理]
      summary: 任务详情
      operationId: getTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [任务管理]
      summary: 更新任务
      description: 仅 PENDING 状态可更新输入参数。
      operationId: updateTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'
        '409':
          description: 任务状态不允许修改
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'
              example:
                code: 70002
                message: 任务状态不允许该操作
                data: null
                timestamp: 1785086825000
    delete:
      tags: [任务管理]
      summary: 删除任务
      description: 仅 PENDING/COMPLETED/FAILED/CANCELLED 状态可删除。
      operationId: deleteTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResult'

  /api/v1/tasks/{taskId}/start:
    post:
      tags: [任务状态]
      summary: 启动任务
      description: 将 PENDING/PAUSED 状态任务转为 RUNNING。
      operationId: startTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 启动成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'

  /api/v1/tasks/{taskId}/pause:
    post:
      tags: [任务状态]
      summary: 暂停任务
      description: 将 RUNNING 状态任务转为 PAUSED。
      operationId: pauseTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 暂停成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'

  /api/v1/tasks/{taskId}/complete:
    post:
      tags: [任务状态]
      summary: 完成任务
      description: 将 RUNNING 状态任务转为 COMPLETED，需提交结果。
      operationId: completeTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                output:
                  type: string
                  description: 任务输出结果（JSON）
                summary:
                  type: string
                  description: 完成摘要
              required: [output]
      responses:
        '200':
          description: 完成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'

  /api/v1/tasks/{taskId}/cancel:
    post:
      tags: [任务状态]
      summary: 取消任务
      description: 取消任务，状态转为 CANCELLED。
      operationId: cancelTask
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: 取消原因
      responses:
        '200':
          description: 取消成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResult'

  /api/v1/tasks/{taskId}/timeline:
    get:
      tags: [任务时间线]
      summary: 任务时间线
      description: 获取任务状态流转历史，按时间升序返回。
      operationId: getTaskTimeline
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResult'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          task_id:
                            type: string
                          events:
                            type: array
                            items:
                              $ref: '#/components/schemas/TimelineEvent'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    SizeParam:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    TaskIdPath:
      name: taskId
      in: path
      required: true
      schema:
        type: string

  responses:
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResult'
          example:
            code: 70001
            message: 任务不存在
            data: null
            timestamp: 1785086825000

  schemas:
    ApiResult:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          nullable: true
        timestamp:
          type: integer
          format: int64
      required: [code, message, timestamp]

    PageData:
      type: object
      properties:
        records:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
      required: [records, total, page, size]

    Task:
      type: object
      description: 任务实体
      properties:
        task_id:
          type: string
        name:
          type: string
          description: 任务名称
        task_type:
          type: string
          enum: [PARSE, ANALYZE, PROFILE, REPORT, SANDBOX, CUSTOM]
          description: 任务类型
        status:
          type: string
          enum: [PENDING, RUNNING, PAUSED, COMPLETED, FAILED, CANCELLED]
          description: 任务状态
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
          description: 优先级
        refs:
          type: array
          description: 关联资源
          items:
            type: object
            properties:
              ref_type:
                type: string
                enum: [FILE, TARGET, USER, REPORT]
              ref_id:
                type: string
              remark:
                type: string
        input:
          type: string
          description: 输入参数（JSON）
        output:
          type: string
          description: 输出结果（JSON）
        progress:
          type: integer
          description: 进度百分比（0-100）
        error_message:
          type: string
          description: 失败原因
        retry_count:
          type: integer
        max_retry:
          type: integer
          default: 3
        creator_id:
          type: string
        creator_name:
          type: string
        tenant_id:
          type: string
        scheduled_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        completed_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    TaskCreateRequest:
      type: object
      properties:
        name:
          type: string
        task_type:
          type: string
          enum: [PARSE, ANALYZE, PROFILE, REPORT, SANDBOX, CUSTOM]
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
          default: NORMAL
        refs:
          type: array
          items:
            type: object
            properties:
              ref_type:
                type: string
              ref_id:
                type: string
              remark:
                type: string
        input:
          type: string
          description: 输入参数（JSON）
        scheduled_at:
          type: integer
          format: int64
          description: 计划执行时间（0=立即）
      required: [name, task_type]

    TaskUpdateRequest:
      type: object
      properties:
        name:
          type: string
        priority:
          type: string
          enum: [LOW, NORMAL, HIGH, URGENT]
        input:
          type: string
        scheduled_at:
          type: integer
          format: int64

    TaskResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/Task'

    TaskPageResult:
      allOf:
        - $ref: '#/components/schemas/ApiResult'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageData'
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        $ref: '#/components/schemas/Task'

    TimelineEvent:
      type: object
      description: 时间线事件
      properties:
        event_id:
          type: string
        event_type:
          type: string
          enum: [CREATED, STARTED, PAUSED, RESUMED, COMPLETED, FAILED, CANCELLED, PROGRESS]
        description:
          type: string
        operator_id:
          type: string
        operator_name:
          type: string
        occurred_at:
          type: integer
          format: int64
        metadata:
          type: string
          description: 附加数据（JSON）
